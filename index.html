<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 KidsParadise 小學館全美語 ESL</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select, button, input {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .tab-content.active {
            display: block;
        }

        .single-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .word-title {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        .pos {
            font-size: 16px;
            color: #7f8c8d;
            font-style: italic;
        }

        .chinese-block {
            font-size: 24px;
            color: #e67e22;
            font-weight: bold;
        }

        .section-box {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .section-content {
            font-size: 16px;
            color: #444;
        }

        .audio-btn {
            background: none;
            color: var(--primary-color);
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .audio-btn:hover {
            color: var(--secondary-color);
        }

        .card-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .page-indicator {
            font-size: 16px;
            color: #666;
            font-weight: bold;
        }

        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-opt-btn {
            padding: 15px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .blank-word-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 40px;
            height: 48px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            line-height: 48px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
            color: #1e293b;
            cursor: pointer;
            user-select: none;
        }

        .letter-box.revealed {
            background-color: #e2e8f0;
            color: #64748b;
            cursor: default;
        }

        .letter-box.active-blank {
            border-color: var(--primary-color);
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .virtual-keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .key-btn {
            background-color: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            min-width: 36px;
        }

        .key-btn.action-key {
            background-color: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 KidsParadise 小學館全美語 ESL</h1>
    </header>

    <div class="controls">
        <div>
            <label for="groupSelect">選擇年級：</label>
            <select id="groupSelect" onchange="changeGroup()"></select>
        </div>
        <div>
            <label for="voiceSelect">語音發音：</label>
            <select id="voiceSelect"></select>
        </div>
        <div>
            <label for="reviewRangeSelect">複習範圍：</label>
            <select id="reviewRangeSelect" onchange="changeReviewRange()">
                <option value="WEEK2">Week 2 (9/7~9/11)</option>
                <option value="WEEK3" selected>Week 3 (9/14~9/18)</option>
                <option value="WEEK4">Week 4 (9/28~10/2)</option>
                <option value="WEEK5">Week 5 (10/5~10/9)</option>
                <option value="ALL">全部範圍</option>
            </select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('learn')">📖 學習</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🧩 選擇題測驗</button>
        <button class="nav-btn" onclick="switchTab('sentenceQuiz')">✏️ 句型挖空選擇</button>
        <button class="nav-btn" onclick="switchTab('dictation')">🎧 聽寫測驗</button>
        <button class="nav-btn" onclick="switchTab('spelling')">✍️ 拼字練習</button>
    </div>

    <div id="learnTab" class="tab-content active">
        <div id="singleCardContainer" class="single-card"></div>
        <div class="card-navigation">
            <button onclick="prevCard()">⬅️ 上一個</button>
            <span id="pageIndicator" class="page-indicator">1 / 1</span>
            <button onclick="nextCard()">下一個 ➡️</button>
        </div>
    </div>

    <div id="quizTab" class="tab-content">
        <div class="quiz-card">
            <h2 id="quizQuestion">---</h2>
            <div id="quizOptions" class="quiz-options"></div>
            <p id="quizFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

    <div id="sentenceQuizTab" class="tab-content">
        <div class="quiz-card">
            <h3 style="color: #666; margin-bottom: 10px;">請根據例句選出正確填空：</h3>
            <div id="sentenceQuestion" style="font-size: 20px; font-weight: bold; color: #2c3e50; margin: 20px 0; line-height: 1.5;">---</div>
            <p id="sentenceChineseHint" style="color: #e67e22; font-size: 16px; font-style: italic;"></p>
            <div id="sentenceOptions" class="quiz-options"></div>
            <p id="sentenceFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initSentenceQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

    <div id="dictationTab" class="tab-content">
        <div class="quiz-card">
            <h2>聽發音填寫單字挖空</h2>
            <button onclick="playDictationAudio()" style="font-size: 24px; padding: 15px 25px; margin: 15px 0;">🔊 點擊播放發音</button>
            <p id="dictationHint" style="color: #666; font-style: italic;"></p>
            <div id="dictationWordContainer" class="blank-word-container"></div>
            <div class="virtual-keyboard" id="dictationKeyboard"></div>
            <p id="dictationFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initDictation()" style="margin-top: 15px; background-color: #7f8c8d;">下一題</button>
        </div>
    </div>

    <div id="spellingTab" class="tab-content">
        <div class="quiz-card">
            <h2>看中文提示拼出挖空單字</h2>
            <div id="spellingChinese" style="font-size: 26px; color: #e67e22; font-weight: bold; margin: 15px 0;">---</div>
            <p id="spellingPos" style="color: #7f8c8d; font-style: italic; margin-bottom: 10px;"></p>
            <div id="spellingWordContainer" class="blank-word-container"></div>
            <div class="virtual-keyboard" id="spellingKeyboard"></div>
            <p id="spellingFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initSpelling()" style="margin-top: 15px; background-color: #7f8c8d;">下一題</button>
        </div>
    </div>

<script>
const defaultData = [
  // ==================== WEEK 2 資料 ====================
  // ESL 1A (Week 2)
  { "word": "new", "pos": "adj.", "group": "ESL 1A", "chinese": "新的", "defEn": "not old; made or bought a short time ago", "example": "I have a new bag.", "range": "WEEK2" },
  { "word": "old", "pos": "adj.", "group": "ESL 1A", "chinese": "舊的/老的", "defEn": "not old; having been here for a long time", "example": "This is my old bike.", "range": "WEEK2" },
  { "word": "play basketball", "pos": "v. phr.", "group": "ESL 1A", "chinese": "打籃球", "defEn": "to play a game with a ball and a basket", "example": "I play basketball with my friends.", "range": "WEEK2" },

  { "word": "play soccer", "pos": "v. phr.", "group": "ESL 1A", "chinese": "踢足球", "defEn": "to play a game where you kick a ball", "example": "They play soccer in the park.", "range": "WEEK2" },
  { "word": "teacher", "pos": "n.", "group": "ESL 1A", "chinese": "老師", "defEn": "a person who teaches children at school", "example": "My teacher is very nice.", "range": "WEEK2" },

  { "word": "really great", "pos": "phr.", "group": "ESL 1A", "chinese": "真的很棒", "defEn": "very good", "example": "The new game is really great.", "range": "WEEK2" },
  { "word": "in the forest", "pos": "phr.", "group": "ESL 1A", "chinese": "在森林裡", "defEn": "in a place with many trees", "example": "There are many animals in the forest.", "range": "WEEK2" },

  { "word": "hotel", "pos": "n.", "group": "ESL 2A", "chinese": "飯店旅館", "defEn": "a place where people can stay when they are away from home", "example": "We stay at a hotel.", "range": "WEEK2" },

  { "word": "river", "pos": "n.", "group": "ESL 4A", "chinese": "河", "defEn": "a long, natural area of water that flows across the land", "example": "We walked beside the river.", "range": "WEEK2" },

  { "word": "adventure", "pos": "n.", "group": "ESL 5A", "chinese": "冒險", "defEn": "an exciting or dangerous experience", "example": "The children went on an exciting adventure in the mountains.", "range": "WEEK3" },
  { "word": "explore", "pos": "v.", "group": "ESL 5A", "chinese": "探索", "defEn": "to travel through a place to learn about it", "example": "We want to explore the old forest behind the school.", "range": "WEEK3" },
  { "word": "journey", "pos": "n.", "group": "ESL 5A", "chinese": "旅程", "defEn": "an act of traveling from one place to another", "example": "Our train journey to the mountains took three hours.", "range": "WEEK3" },
  { "word": "mountain", "pos": "n.", "group": "ESL 5A", "chinese": "山", "defEn": "a very high hill", "example": "The top of the mountain was covered with white snow.", "range": "WEEK3" },
  { "word": "valley", "pos": "n.", "group": "ESL 5A", "chinese": "山谷", "defEn": "an area of low land between hills or mountains", "example": "A clear river flows through the green valley.", "range": "WEEK3" },
  { "word": "forest", "pos": "n.", "group": "ESL 5A", "chinese": "森林", "defEn": "a large area of land covered with trees", "example": "Many wild animals live in the deep forest.", "range": "WEEK3" },
  { "word": "path", "pos": "n.", "group": "ESL 5A", "chinese": "小徑", "defEn": "a track that is made by people walking", "example": "We followed the narrow path through the trees.", "range": "WEEK3" },
  { "word": "safe", "pos": "adj.", "group": "ESL 5A", "chinese": "安全的", "defEn": "protected from danger or harm", "example": "Stay on the main path so you will be safe.", "range": "WEEK3" },
  { "word": "danger", "pos": "n.", "group": "ESL 5A", "chinese": "危險", "defEn": "the possibility of suffering harm or injury", "example": "The hikers were trained to stay away from danger.", "range": "WEEK3" },
  { "word": "guide", "pos": "n. / v.", "group": "ESL 5A", "chinese": "導遊 / 引導", "defEn": "a person who shows you where to go", "example": "Our guide led us safely through the dark cave.", "range": "WEEK3" },
  { "word": "equipment", "pos": "n.", "group": "ESL 5A", "chinese": "裝備 / 設備", "defEn": "the things needed for a particular purpose", "example": "We checked our climbing equipment before starting.", "range": "WEEK3" },
  { "word": "backpack", "pos": "n.", "group": "ESL 5A", "chinese": "背包", "defEn": "a bag carried on your back", "example": "I put my water bottle and jacket in my backpack.", "range": "WEEK3" },
  { "word": "compass", "pos": "n.", "group": "ESL 5A", "chinese": "指南針", "defEn": "an instrument used for finding direction", "example": "The hiker used a compass to find the north.", "range": "WEEK3" },
  { "word": "map", "pos": "n.", "group": "ESL 5A", "chinese": "地圖", "defEn": "a drawing of a place showing roads, rivers, etc.", "example": "We looked at the map to find the way to the camp.", "range": "WEEK3" },
  { "word": "tent", "pos": "n.", "group": "ESL 5A", "chinese": "帳篷", "defEn": "a shelter made of cloth supported by poles", "example": "We set up our tent near the clear stream.", "range": "WEEK3" },

  // ESL 6A (Week 3)
  { "word": "environment", "pos": "n.", "group": "ESL 6A", "chinese": "環境", "defEn": "the natural world in which people, animals, and plants live", "example": "We should do our best to protect the environment.", "range": "WEEK3" },
  { "word": "pollution", "pos": "n.", "group": "ESL 6A", "chinese": "汙染", "defEn": "damage caused to water, air, or land by harmful substances", "example": "Air pollution is a serious problem in big cities.", "range": "WEEK3" },
  { "word": "recycle", "pos": "v.", "group": "ESL 6A", "chinese": "回收", "defEn": "to treat things so they can be used again", "example": "Remember to wash plastic bottles before you recycle them.", "range": "WEEK3" },
  { "word": "energy", "pos": "n.", "group": "ESL 6A", "chinese": "能源 / 精力", "defEn": "power from sources such as electricity or coal", "example": "We can save energy by turning off lights when we leave.", "range": "WEEK3" },
  { "word": "solar", "pos": "adj.", "group": "ESL 6A", "chinese": "太陽能的", "defEn": "connected with the sun or using energy from the sun", "example": "The school uses solar panels to create electricity.", "range": "WEEK3" },
  { "word": "natural", "pos": "adj.", "group": "ESL 6A", "chinese": "自然的", "defEn": "existing in nature; not made by people", "example": "Water and trees are natural resources.", "range": "WEEK3" },
  { "word": "resource", "pos": "n.", "group": "ESL 6A", "chinese": "資源", "defEn": "a supply of something that a country or person has", "example": "We must not waste water because it is a precious resource.", "range": "WEEK3" },
  { "word": "protect", "pos": "v.", "group": "ESL 6A", "chinese": "保護", "defEn": "to keep someone or something safe from harm", "example": "Planting more trees helps protect our earth.", "range": "WEEK3" },
  { "word": "global", "pos": "adj.", "group": "ESL 6A", "chinese": "全球的", "defEn": "affecting the whole world", "example": "Global warming is changing the weather patterns.", "range": "WEEK3" },
  { "word": "climate", "pos": "n.", "group": "ESL 6A", "chinese": "氣候", "defEn": "the regular weather conditions of a place", "example": "Changes in climate affect plants and animals.", "range": "WEEK3" },
  { "word": "temperature", "pos": "n.", "group": "ESL 6A", "chinese": "溫度", "defEn": "a measure of how hot or cold something is", "example": "The summer temperature is getting higher each year.", "range": "WEEK3" },
  { "word": "species", "pos": "n.", "group": "ESL 6A", "chinese": "物種", "defEn": "a group of animals or plants that are similar", "example": "Some rare species of birds live in this forest.", "range": "WEEK3" },
  { "word": "habitat", "pos": "n.", "group": "ESL 6A", "chinese": "棲息地", "defEn": "the natural home of an animal or plant", "example": "Cutting down trees destroys the animals' natural habitat.", "range": "WEEK3" },
  { "word": "endangered", "pos": "adj.", "group": "ESL 6A", "chinese": "瀕危的", "defEn": "at risk of becoming extinct", "example": "Giant pandas are an endangered species.", "range": "WEEK3" },
  { "word": "extinct", "pos": "adj.", "group": "ESL 6A", "chinese": "絕種的 / 滅絕的", "defEn": "no longer existing", "example": "Dinosaurs became extinct millions of years ago.", "range": "WEEK3" },

  // ==================== WEEK 4 資料 ====================
  // ESL 1A (Week 4)
  { "word": "in the garden", "pos": "prep. phr.", "group": "ESL 1A", "chinese": "在花園裡", "defEn": "in the area outside a house where flowers and plants grow", "example": "We play in the garden after school.", "range": "WEEK4" },
  { "word": "singer", "pos": "n.", "group": "ESL 1A", "chinese": "歌手", "defEn": "a person who sings songs", "example": "My sister wants to be a singer one day.", "range": "WEEK4" },
  { "word": "friend", "pos": "n.", "group": "ESL 1A", "chinese": "朋友", "defEn": "a person you like and know well", "example": "Tom is my good friend at school.", "range": "WEEK4" },
  { "word": "doctor", "pos": "n.", "group": "ESL 1A", "chinese": "醫生", "defEn": "a person who helps sick people", "example": "I go to see the doctor when I am sick.", "range": "WEEK4" },
  { "word": "like", "pos": "v.", "group": "ESL 1A", "chinese": "喜歡", "defEn": "to think someone or something is good or nice", "example": "I like this book because it has funny pictures.", "range": "WEEK4" },
  { "word": "have / has", "pos": "v.", "group": "ESL 1A", "chinese": "有", "defEn": "to own or hold something", "example": "She has a new bike, and I have a red bike.", "range": "WEEK4" },
  { "word": "rope", "pos": "n.", "group": "ESL 1A", "chinese": "繩子", "defEn": "a long, strong thing used to pull or tie things", "example": "The boy pulls the box with a rope.", "range": "WEEK4" },
  { "word": "fish", "pos": "n.", "group": "ESL 1A", "chinese": "魚", "defEn": "an animal that lives and swims in water", "example": "There are three small fish in the water.", "range": "WEEK4" },
  { "word": "cook", "pos": "n.", "group": "ESL 1A", "chinese": "廚師", "defEn": "a person who makes food", "example": "The cook makes lunch for the children every day.", "range": "WEEK4" },
  { "word": "head", "pos": "n.", "group": "ESL 1A", "chinese": "頭", "defEn": "the top part of your body", "example": "The boy has a blue hat on his head.", "range": "WEEK4" },
  { "word": "tail", "pos": "n.", "group": "ESL 1A", "chinese": "尾巴", "defEn": "the long part at the back of an animal", "example": "The little dog has a long tail.", "range": "WEEK4" },
  { "word": "catch / caught / caught", "pos": "v.", "group": "ESL 1A", "chinese": "抓住 / 捕抓", "defEn": "to take something that is moving with your hands", "example": "Can you catch the ball with two hands?", "range": "WEEK4" },
  { "word": "girl", "pos": "n.", "group": "ESL 1A", "chinese": "女孩", "defEn": "a young female person", "example": "The girl is reading a book in her bedroom.", "range": "WEEK4" },
  { "word": "boy", "pos": "n.", "group": "ESL 1A", "chinese": "男孩", "defEn": "a young male person", "example": "The boy is playing football with his friends.", "range": "WEEK4" },
  { "word": "hat", "pos": "n.", "group": "ESL 1A", "chinese": "帽子", "defEn": "something you wear on your head", "example": "She is wearing a big red hat today.", "range": "WEEK4" },
  { "word": "take / took / taken", "pos": "v.", "group": "ESL 1A", "chinese": "拿", "defEn": "to carry something with you", "example": "Please take your school bag with you.", "range": "WEEK4" },
  { "word": "strong", "pos": "adj.", "group": "ESL 1A", "chinese": "強壯的", "defEn": "able to carry or move heavy things", "example": "My dad is strong and can carry this big box.", "range": "WEEK4" },
  { "word": "grandfather", "pos": "n.", "group": "ESL 1A", "chinese": "爺爺", "defEn": "the father of your mother or father", "example": "My grandfather likes to walk in the park with me.", "range": "WEEK4" },
  { "word": "queen", "pos": "n.", "group": "ESL 1A", "chinese": "皇后", "defEn": "a woman who rules a country", "example": "The queen lives in a very big house.", "range": "WEEK4" },
  { "word": "walk", "pos": "v.", "group": "ESL 1A", "chinese": "走", "defEn": "to move on your feet, but not run", "example": "We walk to school together every morning.", "range": "WEEK4" },

  // ESL 2A (Week 4)
  { "word": "pull", "pos": "v.", "group": "ESL 2A", "chinese": "拉", "defEn": "to move something toward you", "example": "Please pull the door to open it.", "range": "WEEK4" },
  { "word": "member", "pos": "n.", "group": "ESL 2A", "chinese": "成員 / 會員", "defEn": "a person in a group", "example": "Tom is a member of our school football team.", "range": "WEEK4" },
  { "word": "throw / threw / thrown", "pos": "v.", "group": "ESL 2A", "chinese": "丟", "defEn": "to send something through the air with your hand", "example": "Please throw the ball to me.", "range": "WEEK4" },
  { "word": "run / ran / run", "pos": "v.", "group": "ESL 2A", "chinese": "跑", "defEn": "to move quickly on your feet", "example": "The children run in the playground after school.", "range": "WEEK4" },
  { "word": "ride / rode / ridden", "pos": "v.", "group": "ESL 2A", "chinese": "騎", "defEn": "to sit on and travel on a bike or an animal", "example": "I ride my bike to the park with my dad.", "range": "WEEK4" },
  { "word": "kick", "pos": "v.", "group": "ESL 2A", "chinese": "踢", "defEn": "to hit something with your foot", "example": "Ben can kick the ball very far.", "range": "WEEK4" },
  { "word": "can", "pos": "modal", "group": "ESL 2A", "chinese": "能夠", "defEn": "to be able to do something", "example": "My little sister can swim very well.", "range": "WEEK4" },
  { "word": "hold", "pos": "v.", "group": "ESL 2A", "chinese": "握 / 拿", "defEn": "to have something in your hand", "example": "Please hold my bag for me.", "range": "WEEK4" },
  { "word": "all", "pos": "det.", "group": "ESL 2A", "chinese": "全部", "defEn": "every person or thing in a group", "example": "All the children are in the classroom now.", "range": "WEEK4" },
  { "word": "try", "pos": "v.", "group": "ESL 2A", "chinese": "嘗試", "defEn": "to do something and see if you can do it", "example": "I want to try this new game with my friends.", "range": "WEEK4" },
  { "word": "live", "pos": "v.", "group": "ESL 2A", "chinese": "居住", "defEn": "to have your home somewhere", "example": "My grandparents live in a small house near the park.", "range": "WEEK4" },
  { "word": "tell / told / told", "pos": "v.", "group": "ESL 2A", "chinese": "告訴", "defEn": "to give someone information or a story", "example": "My teacher tells us an interesting story every Friday.", "range": "WEEK4" },
  { "word": "become / became / become", "pos": "v.", "group": "ESL 2A", "chinese": "變成 / 成為", "defEn": "to start to be something", "example": "The little boy wants to become a doctor one day.", "range": "WEEK4" },

  // ESL 3A (Week 4)
  { "word": "will / won't", "pos": "v.", "group": "ESL 3A", "chinese": "將會 / 將不會", "defEn": "used to talk about the future; won't means will not", "example": "We will visit Grandma tomorrow, but we won't stay there for dinner.", "range": "WEEK4" },
  { "word": "restaurant", "pos": "n.", "group": "ESL 3A", "chinese": "餐廳", "defEn": "a place where people pay to eat meals", "example": "My family went to a restaurant for dinner and ordered noodles and soup.", "range": "WEEK4" },
  { "word": "metal", "pos": "n. / adj.", "group": "ESL 3A", "chinese": "金屬 / 金屬製的", "defEn": "a strong material used to make things such as tools and machines", "example": "This spoon is made of metal, so it is stronger than a plastic one.", "range": "WEEK4" },
  { "word": "plastic", "pos": "n. / adj.", "group": "ESL 3A", "chinese": "塑膠 / 塑膠製的", "defEn": "a light material used to make many things", "example": "I carry water in a plastic bottle when I go to the park.", "range": "WEEK4" },
  { "word": "pirate", "pos": "n.", "group": "ESL 3A", "chinese": "海盜", "defEn": "a person in stories who sails on the sea and steals things", "example": "The children dressed as pirates and looked for treasure on the island.", "range": "WEEK4" },
  { "word": "ticket", "pos": "n.", "group": "ESL 3A", "chinese": "票券", "defEn": "a piece of paper or electronic record that lets you travel or enter a place", "example": "Dad bought our train tickets before we went to the station.", "range": "WEEK4" },
  { "word": "handbag", "pos": "n.", "group": "ESL 3A", "chinese": "手提包", "defEn": "a small bag used for carrying personal things", "example": "Mum put her phone and keys in her handbag before leaving home.", "range": "WEEK4" },
  { "word": "rest", "pos": "v. / n.", "group": "ESL 3A", "chinese": "休息", "defEn": "to stop working or moving for a short time", "example": "We sat under a tree to rest after walking around the park for an hour.", "range": "WEEK4" },
  { "word": "island", "pos": "n.", "group": "ESL 3A", "chinese": "島嶼", "defEn": "an area of land with water all around it", "example": "We took a boat to a small island and spent the afternoon on the beach.", "range": "WEEK4" },
  { "word": "treasure", "pos": "n.", "group": "ESL 3A", "chinese": "寶藏", "defEn": "valuable things such as gold, jewels, or money, especially when hidden", "example": "The pirates followed the old map and found treasure inside a cave.", "range": "WEEK4" },
  { "word": "relax", "pos": "v.", "group": "ESL 3A", "chinese": "放鬆", "defEn": "to rest and become calm", "example": "I like to relax on the sofa and read a book in the evening.", "range": "WEEK4" },
  { "word": "example", "pos": "n.", "group": "ESL 3A", "chinese": "範例", "defEn": "something that shows what another thing is like or how something works", "example": "The teacher gave us an example before we started the new exercise.", "range": "WEEK4" },
  { "word": "sometimes", "pos": "adv.", "group": "ESL 3A", "chinese": "有時候", "defEn": "on some occasions but not always", "example": "I sometimes ride my bike to school when the weather is nice.", "range": "WEEK4" },
  { "word": "plant", "pos": "n. / v.", "group": "ESL 3A", "chinese": "植物 / 種植", "defEn": "a living thing that grows in the ground", "example": "We watered the little plants in the garden every day.", "range": "WEEK4" },
  { "word": "kiwi", "pos": "n.", "group": "ESL 3A", "chinese": "奇異果", "defEn": "a small brown fruit with green flesh and tiny black seeds", "example": "Dad cut two kiwis into pieces and added them to our fruit salad.", "range": "WEEK4" },
  { "word": "vine", "pos": "n.", "group": "ESL 3A", "chinese": "藤蔓", "defEn": "a plant with long, thin stems that grows along the ground or climbs", "example": "The green vine grew up the wall and around the window.", "range": "WEEK4" },
  { "word": "coconut tree", "pos": "n.", "group": "ESL 3A", "chinese": "椰子樹", "defEn": "a tall tree that grows coconuts", "example": "We saw many coconut trees near the beach.", "range": "WEEK4" },
  { "word": "coconut", "pos": "n.", "group": "ESL 3A", "chinese": "椰子", "defEn": "a large brown fruit with white flesh inside", "example": "We found a coconut under the tree and opened it to drink the juice.", "range": "WEEK4" },
  { "word": "mango / mangoes", "pos": "n.", "group": "ESL 3A", "chinese": "芒果", "defEn": "a sweet fruit with yellow or orange flesh", "example": "Mum bought three mangoes at the market and made a fruit salad.", "range": "WEEK4" },
  { "word": "palm tree", "pos": "n.", "group": "ESL 3A", "chinese": "棕櫚樹", "defEn": "a tall tree with a straight trunk and large leaves at the top", "example": "There were many palm trees near the beach where we stayed.", "range": "WEEK4" },
  { "word": "palm", "pos": "n.", "group": "ESL 3A", "chinese": "手掌 / 手心", "defEn": "the inside part of your hand between your wrist and fingers", "example": "She held the small shell in the palm of her hand.", "range": "WEEK4" },
  { "word": "bowl", "pos": "n.", "group": "ESL 3A", "chinese": "碗", "defEn": "a round, deep dish used for food or liquids", "example": "I ate a bowl of cereal with milk and fruit for breakfast.", "range": "WEEK4" },
  { "word": "parrot", "pos": "n.", "group": "ESL 3A", "chinese": "鸚鵡", "defEn": "a colorful bird with a curved beak that can sometimes copy sounds", "example": "The green parrot sat on a branch and made a loud sound.", "range": "WEEK4" },

  // ESL 4A (Week 4)
  { "word": "hibernate", "pos": "v.", "group": "ESL 4A", "chinese": "冬眠", "defEn": "to sleep for a long time in winter", "example": "Some animals hibernate in winter and wake up again when the weather gets warmer in spring.", "range": "WEEK4" },
  { "word": "cherry blossom", "pos": "n.", "group": "ESL 4A", "chinese": "櫻花", "defEn": "a pink or white flower on a cherry tree", "example": "Many people go to the park in spring to see the beautiful cherry blossoms and take photos under the trees.", "range": "WEEK4" },
  { "word": "festival", "pos": "n.", "group": "ESL 4A", "chinese": "節日", "defEn": "a special time when people celebrate", "example": "Our town has a spring festival every year, and families enjoy food, music, games, and shows together.", "range": "WEEK4" },
  { "word": "last", "pos": "v.", "group": "ESL 4A", "chinese": "持續", "defEn": "to continue for some time", "example": "The school show lasted for two hours, but we enjoyed it and stayed until the end.", "range": "WEEK4" },
  { "word": "activity / activities", "pos": "n.", "group": "ESL 4A", "chinese": "活動", "defEn": "something that you do", "example": "Our teacher planned some fun activities for the class, and everyone enjoyed playing the games outside.", "range": "WEEK4" },
  { "word": "be born in", "pos": "phr.", "group": "ESL 4A", "chinese": "出生於...", "defEn": "to begin your life in a place or at a time", "example": "My grandfather was born in a small town, but he moved to the city when he was young.", "range": "WEEK4" },
  { "word": "a little bit", "pos": "phr.", "group": "ESL 4A", "chinese": "一點點 / 稍微", "defEn": "a small amount", "example": "I was a little bit nervous before the show, but I felt better when I saw my friends smiling at me.", "range": "WEEK4" },
  { "word": "heavy cream", "pos": "n.", "group": "ESL 4A", "chinese": "濃稠的鮮奶油", "defEn": "thick cream used in food", "example": "Mum put some heavy cream in the soup to make it thicker before we ate it with bread for dinner.", "range": "WEEK4" },
  { "word": "spine", "pos": "n.", "group": "ESL 4A", "chinese": "植物的刺", "defEn": "a sharp point on a plant", "example": "Be careful when you touch that plant because its sharp spines can hurt your fingers.", "range": "WEEK4" },
  { "word": "oil", "pos": "n.", "group": "ESL 4A", "chinese": "油", "defEn": "a thick liquid used for cooking", "example": "Dad put a little oil in the pan before he cooked the vegetables for our dinner.", "range": "WEEK4" },
  { "word": "protect", "pos": "v.", "group": "ESL 4A", "chinese": "保護", "defEn": "to keep someone or something safe", "example": "We should protect animals and the places where they live so they can be safe and healthy.", "range": "WEEK4" },
  { "word": "protection", "pos": "n.", "group": "ESL 4A", "chinese": "保護措施", "defEn": "something that keeps a person or thing safe", "example": "The tortoise has a hard shell for protection when another animal comes too close.", "range": "WEEK4" },
  { "word": "hate", "pos": "v.", "group": "ESL 4A", "chinese": "恨 / 厭惡", "defEn": "to dislike something very much", "example": "I hate getting up very early on cold mornings, but I feel better after I eat breakfast.", "range": "WEEK4" },
  { "word": "fireworks", "pos": "n.", "group": "ESL 4A", "chinese": "煙火", "defEn": "bright lights in the sky at a celebration", "example": "We watched the colorful fireworks in the park, and everyone smiled when they filled the night sky.", "range": "WEEK4" },
  { "word": "stay away (from)", "pos": "phr.", "group": "ESL 4A", "chinese": "遠離 / 避開", "defEn": "to not go near someone or something", "example": "Please stay away from the edge of the cliff because it is high and can be dangerous.", "range": "WEEK4" },
  { "word": "cliff", "pos": "n.", "group": "ESL 4A", "chinese": "懸崖", "defEn": "a high, steep wall of rock", "example": "We stood in a safe place near the cliff and looked at the blue sea far below us.", "range": "WEEK4" },

  // ESL 5A (Week 4)
  { "word": "so", "pos": "conj.", "group": "ESL 5A", "chinese": "所以", "defEn": "used to show a result", "example": "It was getting late, so we packed our things quickly and walked back to the hotel before it became dark.", "range": "WEEK4" },
  { "word": "because", "pos": "conj.", "group": "ESL 5A", "chinese": "因為", "defEn": "used to give a reason", "example": "We stayed near the stream because my little brother wanted to watch the small fish swimming between the rocks.", "range": "WEEK4" },

function populateVoiceList() {
    if (typeof speechSynthesis === 'undefined') return;
    const synth = speechSynthesis;
    const allVoices = synth.getVoices();
    const voiceSelect = document.getElementById('voiceSelect');
    
    let filtered = allVoices.filter(voice => {
        const name = voice.name.toLowerCase();
        const lang = voice.lang.toLowerCase();
        return (name.includes('google') || name.includes('samantha')) && lang.includes('en');
    });

    if (filtered.length === 0) {
        filtered = allVoices.filter(voice => voice.lang.toLowerCase().includes('en-us') || voice.lang.toLowerCase().includes('en'));
    }

    availableVoices = filtered;
    voiceSelect.innerHTML = '';
    
    if (availableVoices.length === 0) {
        const option = document.createElement('option');
        option.textContent = "預設系統語音";
        voiceSelect.appendChild(option);
        return;
    }

    availableVoices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });

    voiceSelect.selectedIndex = 0;
}

populateVoiceList();
if (typeof speechSynthesis !== 'undefined') {
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }
}

function speak(text) {
    if (typeof speechSynthesis === 'undefined') return;
    
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voiceSelect = document.getElementById('voiceSelect');
    const selectedIndex = voiceSelect.value;
    
    if (availableVoices.length > 0 && availableVoices[selectedIndex]) {
        utterance.voice = availableVoices[selectedIndex];
    }
    
    utterance.rate = 0.8;
    utterance.pitch = 1.0;

    setTimeout(() => {
        speechSynthesis.speak(utterance);
    }, 50);
}

function loadDatabase() {
    wordDatabase = defaultData;
    localStorage.setItem('esl_word_db', JSON.stringify(wordDatabase));
}

function switchTab(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'learn') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('learnTab').classList.add('active');
    } else if (tabName === 'quiz') {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('quizTab').classList.add('active');
        initQuiz();
    } else if (tabName === 'sentenceQuiz') {
        document.querySelectorAll('.nav-btn')[2].classList.add('active');
        document.getElementById('sentenceQuizTab').classList.add('active');
        initSentenceQuiz();
    } else if (tabName === 'dictation') {
        document.querySelectorAll('.nav-btn')[3].classList.add('active');
        document.getElementById('dictationTab').classList.add('active');
        initDictation();
    } else if (tabName === 'spelling') {
        document.querySelectorAll('.nav-btn')[4].classList.add('active');
        document.getElementById('spellingTab').classList.add('active');
        initSpelling();
    }
}

    groups.forEach(group => {

        opt.value = group;

}

    currentIndex = 0;
    updateFilteredData();
    renderSingleCard();
    
    if (document.getElementById('quizTab').classList.contains('active')) {
        initQuiz();

    } else if (document.getElementById('dictationTab').classList.contains('active')) {

    } else if (document.getElementById('spellingTab').classList.contains('active')) {

    }
}

function updateFilteredData() {
    const selectedGroup = document.getElementById('groupSelect').value;
    
    let tempFiltered = selectedGroup === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(item => item.group === selectedGroup);

    if (currentRange !== 'ALL') {
        tempFiltered = tempFiltered.filter(item => item.range === currentRange);
    }

    filteredData = tempFiltered;
}

function renderSingleCard() {
    const container = document.getElementById('singleCardContainer');
    const indicator = document.getElementById('pageIndicator');
    
    if (filteredData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">此年級或範圍目前沒有單字資料</div>';
        indicator.textContent = '0 / 0';
        return;
    }

    if (currentIndex >= filteredData.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = filteredData.length - 1;

    const item = filteredData[currentIndex];
    indicator.textContent = `${currentIndex + 1} / ${filteredData.length}`;

    container.innerHTML = `
        <div class="card-header-flex">
            <div>
                <div class="word-title">${item.word}</div>
                <div class="pos">${item.pos || ''} &bull; <span style="color:var(--primary-color);">${item.group}</span></div>
            </div>
            <button class="audio-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')" title="讀出單字">🔊 發音</button>
        </div>
        <div class="chinese-block">${item.chinese}</div>
        <div>
            <div class="section-label">英文解釋 (Definition)</div>
            <div class="section-box">
                <div class="section-content">${item.defEn || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.defEn || '').replace(/'/g, "\\'")}')" title="讀出解釋">🔊</button>
            </div>
        </div>
        <div>
            <div class="section-label">例句 (Example)</div>
            <div class="section-box" style="border-left: 4px solid var(--primary-color);">
                <div class="section-content" style="font-style: italic;">${item.example || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.example || '').replace(/'/g, "\\'")}')" title="讀出例句">🔊</button>
            </div>
        </div>
    `;
}

function nextCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredData.length;
    renderSingleCard();
}

function prevCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
    renderSingleCard();

function initQuiz() {
    document.getElementById('quizFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    const current = pool[Math.floor(Math.random() * pool.length)];
    currentQuizAnswer = current.chinese;
    document.getElementById('quizQuestion').textContent = current.word;

    let options = [current.chinese];
    while (options.length < 4 && options.length < wordDatabase.length) {
        const randomItem = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        if (!options.includes(randomItem.chinese)) options.push(randomItem.chinese);
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            const feedback = document.getElementById('quizFeedback');
            if (opt === currentQuizAnswer) {
                feedback.textContent = '🎉 正確！非常棒！';
                feedback.style.color = 'var(--success-color)';
            } else {
                feedback.textContent = `❌ 答錯囉！正確答案是：${currentQuizAnswer}`;
                feedback.style.color = 'var(--danger-color)';
            }
        };
        optionsContainer.appendChild(btn);
    });
}

function initSentenceQuiz() {
    document.getElementById('sentenceFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    const validPool = pool.filter(item => item.example && item.example.includes(item.word));
    const finalPool = validPool.length > 0 ? validPool : pool;
    if (finalPool.length === 0) return;

    currentSentenceItem = finalPool[Math.floor(Math.random() * finalPool.length)];
    currentSentenceAnswer = currentSentenceItem.word;

    let maskedExample = currentSentenceItem.example;
    const regex = new RegExp(currentSentenceItem.word, 'gi');
    maskedExample = maskedExample.replace(regex, '______');

    document.getElementById('sentenceQuestion').innerHTML = maskedExample;
    document.getElementById('sentenceChineseHint').textContent = `💡 中文提示：${currentSentenceItem.chinese}`;

    let options = [currentSentenceItem.word];
    while (options.length < 4 && options.length < wordDatabase.length) {
        const randomItem = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        if (!options.includes(randomItem.word)) options.push(randomItem.word);
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('sentenceOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            const feedback = document.getElementById('sentenceFeedback');
            if (opt.toLowerCase() === currentSentenceAnswer.toLowerCase()) {
                feedback.textContent = '🎉 答對了！填空正確！';
                feedback.style.color = 'var(--success-color)';

                feedback.textContent = `❌ 答錯囉！正確答案是：${currentSentenceAnswer}`;
                feedback.style.color = 'var(--danger-color)';
            }
        };
        optionsContainer.appendChild(btn);
    });
}

function setupLetterPuzzle(item, containerId, keyboardId, checkCallback) {
    const word = item.word;
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    let stateArray = [];
    for (let i = 0; i < word.length; i++) {
        const char = word[i];
        let isBlank = false;
        let userVal = char;
        
        if (/[a-zA-Z]/.test(char)) {
            isBlank = Math.random() < 0.5;
            if (isBlank) userVal = '';
        }
        
        stateArray.push({ char: char, isBlank: isBlank, userVal: userVal });
    }

    if (!stateArray.some(s => s.isBlank)) {
        const validIndices = [];
        stateArray.forEach((s, idx) => { if (/[a-zA-Z]/.test(s.char)) validIndices.push(idx); });
        if (validIndices.length > 0) {
            const randIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
            stateArray[randIdx].isBlank = true;
            stateArray[randIdx].userVal = '';
        }
    }

    let firstBlank = stateArray.findIndex(s => s.isBlank && s.userVal === '');
    if (firstBlank === -1) firstBlank = 0;

    return { state: stateArray, activeIndex: firstBlank };
}

function renderWordBoxes(state, activeIndex, containerId, clickCallback) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    state.forEach((item, idx) => {
        const box = document.createElement('div');
        box.className = 'letter-box';
        
        if (!item.isBlank) {
            box.classList.add('revealed');
            box.textContent = item.char;
        } else {
            box.textContent = item.userVal || '';
            if (idx === activeIndex) {
                box.classList.add('active-blank');
            }
            box.onclick = () => { clickCallback(idx); };
        }
        container.appendChild(box);
    });
}

function renderVirtualKeyboard(keyboardId, onKeyPress, onDelete) {
    const kb = document.getElementById(keyboardId);
    kb.innerHTML = '';

    const rows = [
        ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
        ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
        ['Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫', ' ␣ ']
    ];

    rows.forEach(rowKeys => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'keyboard-row';
        rowKeys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = key;
            if (key === '⌫' || key === ' ␣ ') {
                btn.classList.add('action-key');
            }
            btn.onclick = () => {
                if (key === '⌫') {
                    onDelete();
                } else if (key === ' ␣ ') {
                    onKeyPress(' ');
                } else {
                    onKeyPress(key.toLowerCase());
                }
            };
            rowDiv.appendChild(btn);
        });
        kb.appendChild(rowDiv);
    });
}

let dictationPuzzle = null;

function initDictation() {
    document.getElementById('dictationFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    dictationItem = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('dictationHint').textContent = `💡 中文提示：${dictationItem.chinese} (${dictationItem.pos || ''})`;
    
    dictationPuzzle = setupLetterPuzzle(dictationItem, 'dictationWordContainer', 'dictationKeyboard', (idx) => {
        dictationPuzzle.activeIndex = idx;
        updateDictationUI();
    });

    renderVirtualKeyboard('dictationKeyboard', handleDictationKeyPress, handleDictationDelete);
    updateDictationUI();
    playDictationAudio();
}

function updateDictationUI() {
    renderWordBoxes(dictationPuzzle.state, dictationPuzzle.activeIndex, 'dictationWordContainer', (idx) => {
        dictationPuzzle.activeIndex = idx;
        updateDictationUI();
    });
}

function handleDictationKeyPress(letter) {
    if (!dictationPuzzle) return;
    const state = dictationPuzzle.state;
    let idx = dictationPuzzle.activeIndex;

    if (idx < state.length) {
        state[idx].userVal = letter;
        let nextIdx = idx + 1;
        while (nextIdx < state.length && (!state[nextIdx].isBlank || state[nextIdx].userVal !== '')) {
            nextIdx++;
        }
        if (nextIdx < state.length) {
            dictationPuzzle.activeIndex = nextIdx;
        }
        updateDictationUI();
        checkDictationAuto();
    }
}

function handleDictationDelete() {
    if (!dictationPuzzle) return;
    const state = dictationPuzzle.state;
    let idx = dictationPuzzle.activeIndex;

    if (state[idx].isBlank && state[idx].userVal !== '') {
        state[idx].userVal = '';
    } else {
        let prevIdx = idx - 1;
        while (prevIdx >= 0 && !state[prevIdx].isBlank) {
            prevIdx--;
        }
        if (prevIdx >= 0) {
            dictationPuzzle.activeIndex = prevIdx;
            state[prevIdx].userVal = '';
        }
    }
    updateDictationUI();
}

function playDictationAudio() {
    if (dictationItem) {
        speak(dictationItem.word);
    }
}

function checkDictationAuto() {
    if (!dictationPuzzle) return;
    const state = dictationPuzzle.state;
    const allFilled = state.every(s => !s.isBlank || s.userVal !== '');
    if (!allFilled) return;

    const userWord = state.map(s => s.userVal).join('');
    const correctWord = dictationItem.word.toLowerCase();
    const feedback = document.getElementById('dictationFeedback');

    if (userWord === correctWord) {
        feedback.textContent = '🎉 拼寫正確！太棒了！';
        feedback.style.color = 'var(--success-color)';
    } else {
        feedback.textContent = `❌ 拼寫錯誤！正確單字是：${dictationItem.word}`;
        feedback.style.color = 'var(--danger-color)';
    }
}

let spellingPuzzle = null;

function initSpelling() {
    document.getElementById('spellingFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    spellingItem = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('spellingChinese').textContent = spellingItem.chinese;
    document.getElementById('spellingPos').textContent = `詞性：${spellingItem.pos || '未分類'} | 英文解釋：${spellingItem.defEn || ''}`;

    spellingPuzzle = setupLetterPuzzle(spellingItem, 'spellingWordContainer', 'spellingKeyboard', (idx) => {
        spellingPuzzle.activeIndex = idx;
        updateSpellingUI();
    });

    renderVirtualKeyboard('spellingKeyboard', handleSpellingKeyPress, handleSpellingDelete);
    updateSpellingUI();
}

function updateSpellingUI() {
    renderWordBoxes(spellingPuzzle.state, spellingPuzzle.activeIndex, 'spellingWordContainer', (idx) => {
        spellingPuzzle.activeIndex = idx;
        updateSpellingUI();
    });
}

function handleSpellingKeyPress(letter) {
    if (!spellingPuzzle) return;
    const state = spellingPuzzle.state;
    let idx = spellingPuzzle.activeIndex;

    if (idx < state.length) {
        state[idx].userVal = letter;
        let nextIdx = idx + 1;
        while (nextIdx < state.length && (!state[nextIdx].isBlank || state[nextIdx].userVal !== '')) {
            nextIdx++;
        }
        if (nextIdx < state.length) {
            spellingPuzzle.activeIndex = nextIdx;
        }
        updateSpellingUI();
        checkSpellingAuto();
    }
}

function handleSpellingDelete() {
    if (!spellingPuzzle) return;
    const state = spellingPuzzle.state;
    let idx = spellingPuzzle.activeIndex;

    if (state[idx].isBlank && state[idx].userVal !== '') {
        state[idx].userVal = '';
    } else {
        let prevIdx = idx - 1;
        while (prevIdx >= 0 && !state[prevIdx].isBlank) {
            prevIdx--;
        }
        if (prevIdx >= 0) {
            spellingPuzzle.activeIndex = prevIdx;
            state[prevIdx].userVal = '';
        }
    }
    updateSpellingUI();
}

function checkSpellingAuto() {
    if (!spellingPuzzle) return;
    const state = spellingPuzzle.state;
    const allFilled = state.every(s => !s.isBlank || s.userVal !== '');
    if (!allFilled) return;

    const userWord = state.map(s => s.userVal).join('');
    const correctWord = spellingItem.word.toLowerCase();
    const feedback = document.getElementById('spellingFeedback');

    if (userWord === correctWord) {
        feedback.textContent = '🎉 拼字完全正確！';
        feedback.style.color = 'var(--success-color)';
        speak(spellingItem.word);
    } else {
        feedback.textContent = `❌ 答錯囉！正確拼字是：${spellingItem.word}`;
        feedback.style.color = 'var(--danger-color)';
    }
}

function initApp() {
    loadDatabase();
    populateGroupFilter();
    updateFilteredData();
    renderSingleCard();
    
    document.body.addEventListener('touchstart', function() {
        if (typeof speechSynthesis !== 'undefined') {
            const unlockUtter = new SpeechSynthesisUtterance('');
            unlockUtter.volume = 0;
            speechSynthesis.speak(unlockUtter);
        }
    }, { once: true });
}

window.onload = initApp;
</script>
